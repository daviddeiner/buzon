<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzón Cupissa</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--c:#7c3aed;--b:#e5e7eb;--t:#1f2937;--bg:#f6f5fb}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial,sans-serif;color:var(--t);background:var(--bg)}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;background:#fff;border-bottom:1px solid var(--b);flex-wrap:wrap}
header h1{font-size:17px;margin:0;margin-right:auto;color:var(--c)}
button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--b);background:#fff;border-radius:7px;padding:6px 10px}
button:hover{background:#f3f0ff}.p{background:var(--c);color:#fff;border-color:var(--c)}.p:hover{background:#6d28d9}
main{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:14px;max-width:1300px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px}
.box h3{margin:0 0 8px;font-size:14px}
input,select{border:1px solid var(--b);border-radius:7px;padding:7px;width:100%}
#list{max-height:430px;overflow:auto;margin-top:8px;border-top:1px solid var(--b)}
#list label{display:flex;gap:8px;padding:5px 2px;border-bottom:1px solid #f1f1f4;align-items:center}
#list input{width:auto}#list small{color:#6b7280;display:block}
.row{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap;align-items:center}.row>*{width:auto}.row>input.f,.row>select.f{flex:1;min-width:0}
.tb{display:flex;gap:4px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid var(--b);margin-bottom:10px}
.tb select,.tb input[type=color]{width:auto;padding:4px}.tb input[type=color]{height:30px;width:34px;padding:1px}
#stage{padding:22px 10px;border-radius:10px;margin-top:8px}
#card{max-width:600px;margin:auto;border-radius:12px;padding:26px;font:16px/1.5 Arial,sans-serif;color:#222}
#logo{text-align:center;margin-bottom:14px}#logo img{max-width:180px}
#ed{min-height:260px;outline:none}#sig{margin-top:22px;border-top:1px dashed #ddd;padding-top:10px;outline:none}
#emo{display:none;flex-wrap:wrap;gap:2px;background:#fff;border:1px solid var(--b);border-radius:8px;padding:6px;margin:6px 0;max-width:420px}
#emo span{cursor:pointer;font-size:20px;padding:2px 3px}
#msg{font-size:13px;color:#b45309;margin:6px 0;white-space:pre-wrap}
dialog{border:1px solid var(--b);border-radius:12px;max-width:480px;width:92%}dialog label{display:block;margin-top:8px;font-weight:600}
.chip{display:inline-block;background:#f3f0ff;border-radius:99px;padding:2px 8px;margin:2px;font-size:12px}
</style></head><body>
<header><h1>✉️ Buzón Cupissa</h1><span id="who" style="color:#6b7280"></span>
<button id="bLogin" class="p" onclick="login()">Conectar con Google</button><button onclick="openCfg()">⚙️ Ajustes</button></header>
<main>
<section class="box"><h3>👥 Destinatarios <span id="cnt" class="chip">0</span></h3>
<div class="row"><button onclick="loadClients()">Cargar clientes de Supabase</button></div>
<input id="q" placeholder="Buscar nombre o correo…" oninput="renderClients()">
<div class="row"><button onclick="selAll(1)">Todos</button><button onclick="selAll(0)">Ninguno</button></div>
<div class="row"><input class="f" id="man" placeholder="Agregar un correo manual"><button onclick="addMan()">+</button></div>
<div id="list"></div></section>

<section class="box"><h3>✍️ Redactar</h3>
<div class="row"><select class="f" id="from" onchange="loadSig()"></select></div>
<div class="row"><input class="f" id="subj" placeholder="Asunto"><button onmousedown="event.preventDefault()" onclick="emoTarget='s';toggleEmo()">😀</button></div>
<div class="tb" onmousedown="if(event.target.tagName!='SELECT'&&event.target.tagName!='INPUT')event.preventDefault()">
<select onchange="cmd('fontName',this.value)"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>Times New Roman</option><option>Courier New</option></select>
<select onchange="setSize(this.value)"><option value="">Tamaño</option><option>12</option><option>14</option><option>16</option><option>18</option><option>22</option><option>28</option><option>36</option><option>48</option></select>
<button onclick="bump(-2)">A−</button><button onclick="bump(2)">A+</button>
<button onclick="cmd('bold')"><b>N</b></button><button onclick="cmd('italic')"><i>K</i></button><button onclick="cmd('underline')"><u>S</u></button>
<button onclick="cmd('justifyLeft')">⬅</button><button onclick="cmd('justifyCenter')">↔</button><button onclick="cmd('justifyRight')">➡</button>
<button onclick="cmd('insertUnorderedList')">• Lista</button>
<span title="Color de texto">A <input type="color" value="#222222" onchange="cmd('foreColor',this.value)"></span>
<span title="Resaltado">🖍 <input type="color" value="#fff3a3" onchange="cmd('hiliteColor',this.value)"></span>
<button onclick="emoTarget='e';toggleEmo()">😀</button>
<button onclick="addLink()">🔗</button><button onclick="document.getElementById('imgf').click()">🖼 Imagen</button>
<button onclick="addBtn('Botón de acción')">🔘 Botón</button><button onclick="addBtn('Formulario')">📝 Formulario</button>
<button onclick="cmd('insertText','{{nombre}}')">👤 {{nombre}}</button></div>
<div id="emo"></div>
<div class="row">Fondo: <select class="f" id="pre" onchange="preset()"></select>
<input type="color" id="cbg" value="#f4f4f7" onchange="gr='';style()" title="Fondo del correo"><input type="color" id="ccd" value="#ffffff" onchange="style()" title="Fondo de la tarjeta"></div>
<div id="stage"><div id="card"><div id="logo"></div><div id="ed" contenteditable="true"><h2 style="text-align:center">¡Hola {{nombre}}! 🎉</h2><p>Escribe aquí tu mensaje…</p></div><div id="sig" contenteditable="true"></div></div></div>
<div class="row"><input type="file" id="fil" multiple onchange="addFiles(this)"><span id="fl"></span></div>
<input type="file" id="imgf" accept="image/*" hidden onchange="addImg(this)">
<div class="row"><button onclick="send(true)">🧪 Enviarme prueba</button><button class="p" onclick="send(false)">🚀 Enviar a seleccionados</button></div>
<div id="msg"></div></section></main>

<dialog id="dlg"><h3>⚙️ Ajustes (se guardan en este navegador)</h3>
<label>Google OAuth Client ID</label><input id="gid">
<label>Supabase URL</label><input id="surl" placeholder="https://xxxx.supabase.co">
<label>Supabase anon key</label><input id="skey">
<div class="row"><div style="flex:1"><label>Tabla</label><input id="tbl" placeholder="clientes"></div><div style="flex:1"><label>Col. correo</label><input id="ecol" placeholder="email"></div><div style="flex:1"><label>Col. nombre</label><input id="ncol" placeholder="nombre"></div></div>
<label>URL de tu formulario (por defecto)</label><input id="furl" placeholder="https://…">
<label>Logo de Cupissa</label><input type="file" id="logof" accept="image/*">
<div class="row" style="margin-top:12px"><button class="p" onclick="saveCfg()">Guardar</button><button onclick="dlg.close()">Cerrar</button></div></dialog>

<script>
const $=s=>document.querySelector(s),ed=$('#ed'),sig=$('#sig'),dlg=$('#dlg');
let cfg=JSON.parse(localStorage.getItem('cfg')||'{}'),tok=null,exp=0,tc=null,al=[],cl=[],sel=new Set(),rg=null,files=[],gr='',emoTarget='e';
const F=['gid','surl','skey','tbl','ecol','ncol','furl'];
const PRE={'Blanco limpio':['#f4f4f7','','#ffffff'],'Rosa suave':['#ffe4ec','linear-gradient(135deg,#ffe4ec,#ffd1e0)','#ffffff'],'Noche':['#1b1340','linear-gradient(135deg,#14142b,#2d1b69)','#ffffff'],'Cálido':['#ffe9c7','linear-gradient(135deg,#fff4e0,#ffd9a8)','#fffdf8'],'Océano':['#cfeaff','linear-gradient(135deg,#e0f4ff,#b3e0ff)','#ffffff']};
const EM='😀 😍 🥰 😎 🤩 🎉 🎁 🔥 ✨ ⭐ 💜 💖 👍 👏 🙌 💯 🛍️ 🛒 💸 🏷️ ⏰ 📣 📢 🚀 🌟 🍰 🎂 🍫 🌸 🌈 ☀️ 🎈 ❤️ ✅ 👉 📍 📞 💌 🎊 🏆'.split(' ');
const msg=t=>$('#msg').textContent=t,sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('#pre').innerHTML=Object.keys(PRE).map(k=>`<option>${k}</option>`).join('');
$('#emo').innerHTML=EM.map(e=>`<span onmousedown="event.preventDefault()" onclick="putEmo('${e}')">${e}</span>`).join('');
function style(){$('#stage').style.cssText=`background:${$('#cbg').value};${gr?'background-image:'+gr:''}`;$('#card').style.background=$('#ccd').value}
function preset(){const p=PRE[$('#pre').value];$('#cbg').value=p[0];gr=p[1];$('#ccd').value=p[2];style()}
function logoUI(){$('#logo').innerHTML=cfg.logo?`<img src="${cfg.logo}">`:'<small style="color:#aaa">(Sube el logo en ⚙️ Ajustes)</small>'}
function openCfg(){F.forEach(k=>$('#'+k).value=cfg[k]||'');dlg.showModal()}
function small(file,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL(file.type=='image/png'?'image/png':'image/jpeg',.88))};i.src=r.result};r.readAsDataURL(file)}
function saveCfg(){F.forEach(k=>cfg[k]=$('#'+k).value.trim());const f=$('#logof').files[0];const done=()=>{localStorage.setItem('cfg',JSON.stringify(cfg));logoUI();dlg.close()};f?small(f,500,d=>{cfg.logo=d;done()}):done()}
/* ---- Google ---- */
function login(){if(!cfg.gid)return openCfg();tc=google.accounts.oauth2.initTokenClient({client_id:cfg.gid,scope:'https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.settings.basic',callback:async r=>{if(r.error)return msg('Google: '+r.error);setTok(r);await loadAl()}});tc.requestAccessToken()}
function setTok(r){tok=r.access_token;exp=Date.now()+r.expires_in*1000-60000}
const getTok=()=>new Promise(res=>{if(tok&&Date.now()<exp)return res(tok);tc.callback=r=>{setTok(r);res(tok)};tc.requestAccessToken({prompt:''})});
async function loadAl(){const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/settings/sendAs',{headers:{Authorization:'Bearer '+tok}});const d=await r.json();if(!r.ok)return msg('Gmail: '+(d.error?.message||r.status));
al=(d.sendAs||[]).filter(a=>a.isPrimary||a.verificationStatus==='accepted');$('#from').innerHTML=al.map((a,i)=>`<option value="${i}">${a.displayName?a.displayName+' — ':''}${a.sendAsEmail}</option>`).join('');$('#who').textContent=al.length+' alias disponibles';$('#bLogin').textContent='Conectado ✓';loadSig()}
function loadSig(){const a=al[$('#from').value];if(!a)return;sig.innerHTML=localStorage.getItem('sig_'+a.sendAsEmail)??(a.signature||'')}
sig.oninput=()=>{const a=al[$('#from').value];if(a)localStorage.setItem('sig_'+a.sendAsEmail,sig.innerHTML)};
/* ---- Supabase ---- */
async function loadClients(){if(!cfg.surl||!cfg.skey)return openCfg();let all=[],from=0;msg('Cargando clientes…');
while(1){const r=await fetch(`${cfg.surl}/rest/v1/${cfg.tbl||'clientes'}?select=*`,{headers:{apikey:cfg.skey,Authorization:'Bearer '+cfg.skey,'Range-Unit':'items',Range:`${from}-${from+999}`}});
if(!r.ok)return msg('Supabase: '+r.status+' '+await r.text());const d=await r.json();all=all.concat(d);if(d.length<1000)break;from+=1000}
cl=all.map(c=>({e:(c[cfg.ecol||'email']||'').trim(),n:c[cfg.ncol||'nombre']||''})).filter(c=>c.e);msg(cl.length+' clientes cargados');renderClients()}
function vis(){const q=$('#q').value.toLowerCase();return cl.filter(c=>(c.e+c.n).toLowerCase().includes(q))}
function renderClients(){$('#list').innerHTML=vis().slice(0,500).map(c=>`<label><input type="checkbox" ${sel.has(c.e)?'checked':''} onchange="tg('${c.e.replace(/'/g,"\\'")}',this.checked)"><span>${c.n||'(sin nombre)'}<small>${c.e}</small></span></label>`).join('');$('#cnt').textContent=sel.size}
function tg(e,v){v?sel.add(e):sel.delete(e);$('#cnt').textContent=sel.size}
function selAll(v){vis().forEach(c=>v?sel.add(c.e):sel.delete(c.e));renderClients()}
function addMan(){const e=$('#man').value.trim();if(!/\S+@\S+/.test(e))return;if(!cl.find(c=>c.e==e))cl.unshift({e,n:''});sel.add(e);$('#man').value='';renderClients()}
/* ---- Editor ---- */
const sv=()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rg=s.getRangeAt(0)};
['keyup','mouseup','focus'].forEach(e=>ed.addEventListener(e,sv));
function rs(){ed.focus();if(rg){const s=getSelection();s.removeAllRanges();s.addRange(rg)}}
function cmd(c,v){rs();document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);sv()}
function setSize(px){if(!px)return;rs();document.execCommand('styleWithCSS',false,false);document.execCommand('fontSize',false,7);ed.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=px+'px'});sv()}
function bump(d){rs();const s=getSelection();let n=s.anchorNode;if(n&&n.nodeType==3)n=n.parentElement;setSize(Math.max(8,parseInt(getComputedStyle(n||ed).fontSize)+d))}
function toggleEmo(){const e=$('#emo');e.style.display=e.style.display=='flex'?'none':'flex'}
function putEmo(e){if(emoTarget=='s'){const i=$('#subj'),p=i.selectionStart??i.value.length;i.value=i.value.slice(0,p)+e+i.value.slice(p);i.focus()}else cmd('insertText',e)}
function addLink(){const u=prompt('URL del enlace:','https://');if(u)cmd('createLink',u)}
function addBtn(k){const t=prompt('Texto del botón:',k=='Formulario'?'Llenar formulario':'¡Compra ahora!');if(!t)return;const u=prompt('URL de destino:',k=='Formulario'?(cfg.furl||'https://'):'https://');if(!u)return;const c=prompt('Color del botón (hex):','#7c3aed')||'#7c3aed';
cmd('insertHTML',`<div style="text-align:center;margin:18px 0"><a href="${u}" style="background:${c};color:#fff;padding:14px 28px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block">${t}</a></div><p><br></p>`)}
function addImg(i){const f=i.files[0];if(f)small(f,900,d=>cmd('insertHTML',`<img src="${d}" style="max-width:100%;height:auto;border-radius:8px">`));i.value=''}
function addFiles(i){[...i.files].forEach(f=>{const r=new FileReader();r.onload=()=>{files.push({name:f.name,type:f.type,data:r.result.split(',')[1]});$('#fl').textContent=files.map(x=>x.name).join(', ')};r.readAsDataURL(f)});i.value=''}
/* ---- MIME / envío ---- */
function enc(s){let r='';new TextEncoder().encode(s).forEach(x=>r+=String.fromCharCode(x));return btoa(r)}
const wrap=b=>b.replace(/.{1,76}/g,'$&\r\n'),hdr=s=>/^[\x20-\x7e]*$/.test(s)?s:'=?UTF-8?B?'+enc(s)+'?=';
function build(){const logo=cfg.logo?`<div style="text-align:center;padding-bottom:16px"><img src="${cfg.logo}" alt="Cupissa" style="max-width:180px;height:auto"></div>`:'';const bg=$('#cbg').value;
return `<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:${bg}"><table width="100%" cellpadding="0" cellspacing="0" bgcolor="${bg}" style="background-color:${bg};${gr?'background-image:'+gr:''}"><tr><td align="center" style="padding:24px 12px"><table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:${$('#ccd').value};border-radius:12px"><tr><td style="padding:28px;font-family:Arial,sans-serif;color:#222;font-size:16px;line-height:1.5">${logo}${ed.innerHTML}<div style="margin-top:24px;border-top:1px solid #eee;padding-top:12px">${sig.innerHTML}</div></td></tr></table></td></tr></table></body></html>`}
function prep(){const doc=new DOMParser().parseFromString(build(),'text/html'),inl=[];doc.querySelectorAll('img').forEach((im,i)=>{const m=/^data:([^;]+);base64,(.*)$/.exec(im.getAttribute('src')||'');if(m){const cid='i'+i+'@cupissa';inl.push({cid,type:m[1],data:m[2]});im.setAttribute('src','cid:'+cid)}});return{html:'<!doctype html>'+doc.documentElement.outerHTML,inl}}
function mime(from,fe,to,subj,html,inl){const r=()=>Math.random().toString(36).slice(2),b1='m'+r(),b2='a'+r(),b3='r'+r(),txt=html.replace(/<style[\s\S]*?<\/style>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
let m=`From: ${from}\r\nTo: ${to}\r\nSubject: ${hdr(subj)}\r\nMIME-Version: 1.0\r\nList-Unsubscribe: <mailto:${fe}?subject=baja>\r\nContent-Type: multipart/mixed; boundary="${b1}"\r\n\r\n--${b1}\r\nContent-Type: multipart/alternative; boundary="${b2}"\r\n\r\n`;
m+=`--${b2}\r\nContent-Type: text/plain; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap(enc(txt))}--${b2}\r\nContent-Type: multipart/related; boundary="${b3}"\r\n\r\n--${b3}\r\nContent-Type: text/html; charset=UTF-8\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap(enc(html))}`;
inl.forEach(i=>m+=`--${b3}\r\nContent-Type: ${i.type}\r\nContent-Transfer-Encoding: base64\r\nContent-ID: <${i.cid}>\r\nContent-Disposition: inline\r\n\r\n${wrap(i.data)}`);
m+=`--${b3}--\r\n--${b2}--\r\n`;files.forEach(a=>m+=`--${b1}\r\nContent-Type: ${a.type||'application/octet-stream'}; name="${hdr(a.name)}"\r\nContent-Transfer-Encoding: base64\r\nContent-Disposition: attachment; filename="${hdr(a.name)}"\r\n\r\n${wrap(a.data)}`);return m+`--${b1}--`}
async function send(test){const a=al[$('#from').value];if(!a)return msg('Primero conecta con Google.');const subj=$('#subj').value.trim();if(!subj)return msg('Falta el asunto.');
const to=test?[{e:a.sendAsEmail,n:'Prueba'}]:cl.filter(c=>sel.has(c.e));if(!to.length)return msg('Selecciona destinatarios.');
if(!test&&!confirm(`Enviar a ${to.length} destinatario(s) desde ${a.sendAsEmail}?`))return;
const{html,inl}=prep(),nm=(a.displayName||'').replace(/["<>,]/g,''),from=(nm?hdr(nm)+' ':'')+`<${a.sendAsEmail}>`;let ok=0,bad=[];
for(const [i,c] of to.entries()){msg(`Enviando ${i+1}/${to.length}… (✓${ok} ✗${bad.length})`);
try{const raw=btoa(mime(from,a.sendAsEmail,c.e,subj.replace(/{{nombre}}/g,c.n),html.replace(/{{nombre}}/g,c.n||''),inl)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{Authorization:'Bearer '+await getTok(),'Content-Type':'application/json'},body:JSON.stringify({raw})});
if(r.ok)ok++;else{bad.push(c.e);if(r.status==429||r.status==403){msg('Límite de Gmail alcanzado. Enviados: '+ok);break}}}catch(e){bad.push(c.e)}
await sleep(1200)}
msg(`Listo ✓ ${ok} enviados`+(bad.length?`\n✗ Fallaron: ${bad.join(', ')}`:''))}
logoUI();preset();if(!cfg.gid)openCfg();
</script></body></html>
